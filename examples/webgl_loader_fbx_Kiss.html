<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - FBX loader con textura externa</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener" style="color: #ffff00; text-decoration: none;">three.js</a> - FBXLoader con textura externa<br />
			Modelo FBX con animación, textura aplicada y luz superior con sombra
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import Stats from 'three/addons/libs/stats.module.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			const manager = new THREE.LoadingManager();
			const textureLoader = new THREE.TextureLoader(); 

			let camera, scene, renderer, controls, stats, object, loader, guiMorphsFolder, guiAnimationsFolder;
			let mixer;

			const timer = new THREE.Timer();
			timer.connect( document );

			// ⚙️ CONFIGURACIÓN
			const params = {
				asset: 'Kiss' // <-- MODELO CAMBIADO
			};

			const assets = [
				'Using A Fax Machine',
				'Walk Strafe Left',
				'Cover To Stand',
				'Kiss',
				'Dodging Right'
			];

			const scales = new Map();

			init();

			function init() {
				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 2000 );
				camera.position.set( 100, 200, 300 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xa0a0a0 );
				scene.fog = new THREE.Fog( 0xa0a0a0, 200, 1000 );

				const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 3 );
				hemiLight.position.set( 0, 200, 0 );
				scene.add( hemiLight );

				const dirLight = new THREE.DirectionalLight( 0xffffff, 3 );
				dirLight.position.set( 0, 200, 100 );
				dirLight.castShadow = false; 
				scene.add( dirLight );

				const topLight = new THREE.DirectionalLight( 0xffffff, 4 );
				topLight.position.set( 0, 400, 0 ); 
				topLight.castShadow = true;
				
				topLight.shadow.mapSize.width = 1024; 
				topLight.shadow.mapSize.height = 1024;
				topLight.shadow.camera.near = 0.5;
				topLight.shadow.camera.far = 1000;
				topLight.shadow.camera.left = -150;
				topLight.shadow.camera.right = 150;
				topLight.shadow.camera.top = 150;
				topLight.shadow.camera.bottom = -150;
				scene.add( topLight );

				const mesh = new THREE.Mesh( 
					new THREE.PlaneGeometry( 2000, 2000 ), 
					new THREE.MeshStandardMaterial( { color: 0x999999, roughness: 0.8, metalness: 0.2 } ) 
				);
				mesh.rotation.x = - Math.PI / 2;
				mesh.receiveShadow = true;
				scene.add( mesh );

				const grid = new THREE.GridHelper( 2000, 20, 0x000000, 0x000000 );
				grid.material.opacity = 0.2;
				grid.material.transparent = true;
				scene.add( grid );
			
				loader = new FBXLoader( manager );
				loadAsset( params.asset );

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( Math.min( window.devicePixelRatio, 2 ) );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				renderer.shadowMap.type = THREE.PCFShadowMap; 
				container.appendChild( renderer.domElement );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableZoom = false;
				controls.enablePan = false;
				controls.enableDamping = true;
				controls.target.set( 0, 100, 0 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

				stats = new Stats();
				container.appendChild( stats.dom );

				const gui = new GUI();
				gui.add( params, 'asset', assets ).onChange( function ( value ) {
					loadAsset( value );
				} );

				guiMorphsFolder = gui.addFolder( 'Morphs' ).hide();
				guiAnimationsFolder = gui.addFolder( 'Animations' ).hide();
			}

			function loadAsset( asset ) {
				loader.trimAnimationClips = false;

				loader.load( 'models/fbx/' + encodeURIComponent( asset ) + '.fbx', function ( group ) {
					if ( object ) {
						object.traverse( function ( child ) {
							if ( child.isSkinnedMesh ) child.skeleton.dispose();
							if ( child.material ) {
								const materials = Array.isArray( child.material ) ? child.material : [ child.material ];
								materials.forEach( material => {
									if ( material.map ) material.map.dispose();
									material.dispose();
								} );
							}
							if ( child.geometry ) child.geometry.dispose();
						} );
						scene.remove( object );
					}

					object = group;
					const scale = scales.get( asset );
					object.scale.setScalar( scale || 1 );

					guiAnimationsFolder.children.forEach( ( child ) => child.destroy() );
					guiAnimationsFolder.hide();

					if ( object.animations && object.animations.length ) {
						mixer = new THREE.AnimationMixer( object );
						const action = mixer.clipAction( object.animations[ 0 ] );
						action.play();

						const clips = object.animations;
						const animationParams = { clip: clips[ 0 ].name };

						guiAnimationsFolder.show();
						guiAnimationsFolder.add( animationParams, 'clip', clips.map( ( clip ) => clip.name ) ).onChange( function ( name ) {
							mixer.stopAllAction();
							const clip = THREE.AnimationClip.findByName( clips, name );
							mixer.clipAction( clip ).play();
						} );
					} else {
						mixer = null;
					}

					guiMorphsFolder.children.forEach( ( child ) => child.destroy() );
					guiMorphsFolder.hide();

					// 🎨 TEXTURA Y MATERIAL (Imagen 4.jpg)
					const texturePath = 'models/textures/4.jpg?v=' + Date.now(); // <-- IMAGEN CAMBIADA
					
					const wrapperTexture = textureLoader.load( texturePath, function(texture) {
						texture.colorSpace = THREE.SRGBColorSpace; 
					});

					object.traverse( function ( child ) {
						if ( child.isMesh ) {
							child.castShadow = true;
							child.receiveShadow = true;

							const shinyMaterial = new THREE.MeshPhongMaterial( {
								map: wrapperTexture,
								color: 0xffffff,    
								specular: 0x555555, 
								shininess: 60,      
								side: THREE.DoubleSide
							} );

							if ( Array.isArray( child.material ) ) {
								child.material = child.material.map( () => shinyMaterial );
							} else {
								child.material = shinyMaterial;
							}

							if ( child.morphTargetDictionary ) {
								guiMorphsFolder.show();
								const meshFolder = guiMorphsFolder.addFolder( child.name || child.uuid );
								Object.keys( child.morphTargetDictionary ).forEach( ( key ) => {
									meshFolder.add( child.morphTargetInfluences, child.morphTargetDictionary[ key ], 0, 1, 0.01 );
								} );
							}
						}
					} );

					scene.add( object );
				}, undefined, function(error) {
					console.error("Error al cargar el modelo.", error);
				} );
			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );
			}

			function animate() {
				timer.update();
				const delta = timer.getDelta();
				if ( mixer ) mixer.update( delta );
				controls.update();
				renderer.render( scene, camera );
				stats.update();
			}
		</script>
	</body>
</html>
